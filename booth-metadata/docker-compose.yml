services:
  booth-metadata:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OUTPUT_FILE: ""
      DEVICE_OUTPUT_FILE: ""
    volumes:
      - ./data:/data

  device-metadata:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["device_metadata.py"]
    env_file:
      - .env
    environment:
      OUTPUT_FILE: ""
      BOOTH_OUTPUT_FILE: ""
    volumes:
      - ./data:/data